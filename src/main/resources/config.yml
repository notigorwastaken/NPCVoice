tts:
  provider: piper
  # Stream audio in chunks and start playback while it is still being generated.
  # Only used when the active provider supports streaming (openai, elevenlabs, azure).
  streaming: true
  piper:
    executable: piper
    model: en_US-lessac-medium
    url: "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
  elevenlabs:
    api_key: ""
    model: eleven_multilingual_v2
    # ElevenLabs voice ID used when an NPC does not override its voice.
    voice: ""
    api_url: "https://api.elevenlabs.io/v1/text-to-speech"
  openai:
    api_key: ""
    model: tts-1
    voice: alloy
    api_url: "https://api.openai.com/v1/audio/speech"
  edgetts:
    voice: en-US-JennyNeural
    rate: 0
    volume: 0
    pitch: 0
  google:
    api_key: ""
    language_code: en-US
    voice: en-US-Neural2-C
    pitch: 0
    speed: 1.0
  azure:
    api_key: ""
    region: "" # e.g. eastus
    voice: en-US-JennyNeural
    pitch: "+0Hz"
    speed: 1.0
  gtts:
    executable: gtts-cli
    lang: en
    slow: false

stt:
  provider: none # none | openai | google
  openai:
    api_key: ""
    model: whisper-1
    api_url: "https://api.openai.com/v1/audio/transcriptions"
  google:
    api_key: ""
    api_url: "https://speech.googleapis.com/v1/speech:recognize"
    language_code: en-US

speak_to_speak:
  # Player speaks near an NPC -> speech is transcribed (STT) and the NPC replies with TTS.
  enabled: false
  radius: 8
  cooldown: 10
  max_audio_ms: 10000
  min_speech_ms: 700
  silence_ms: 400

audio:
  enabled: true
  max_cached_files: 50

voices:
  default: narrator
  presets:
    narrator: en_US-lessac-medium

voicechat:
  distance: 20
  volume: 1.0

# Time limits for external TTS/STT HTTP requests. These prevent a stalled
# provider from holding a worker thread forever.
network:
  connect_timeout_ms: 10000
  read_timeout_ms: 60000

nameplate:
  speaking_icon:
    enabled: true
    # Shown while the NPC speaks: next to the name for non-player NPCs, and as a
    # floating hologram for player-type NPCs (renaming player NPCs makes Citizens
    # despawn/respawn them, so their name is never touched). Empty string disables it.
    # If it renders as a box (□), your client lacks that glyph - use a vanilla
    # safe symbol instead, e.g. "»", "♪" or "✦".
    icon: "🗨"

cache:
  enabled: true
  max_size_mb: 500

dialogue:
  default_cooldown: 3
  default_approach_radius: 6

debug: false

npcs: {}
